{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:0 auto">
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-block">Зарегистрироваться</button>
    </form>
    <p class="muted center mt-2">
        Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </p>
</div>
{% endblock %}
