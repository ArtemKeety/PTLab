<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Магазин{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #222;
            margin: 0;
            min-height: 100vh;
        }
        header {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .logo {
            font-weight: 600;
            color: #4f46e5;
            text-decoration: none;
            font-size: 18px;
        }
        header nav { display: flex; align-items: center; gap: 8px; }
        header nav a {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all .15s;
        }
        header nav a:hover { background: #eef2ff; color: #4f46e5; }
        header nav form { display: inline; }
        header nav form button {
            color: #dc2626;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        header nav form button:hover { background: #fef2f2; }

        main { max-width: 720px; margin: 32px auto; padding: 0 16px; }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #eef0f3;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }
        h1, h2, h3 { margin-top: 0; color: #111827; }
        h2 { font-size: 22px; }
        h3 { font-size: 18px; }

        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eef0f3; }
        th { color: #6b7280; font-weight: 500; font-size: 13px; text-transform: uppercase; }
        .product-row td { padding: 14px 8px; }
        .price { color: #059669; font-weight: 600; }

        .btn {
            display: inline-block;
            background: #4f46e5;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            font-family: inherit;
            transition: background .15s;
        }
        .btn:hover { background: #4338ca; }
        .btn-block { width: 100%; text-align: center; }

        form p { margin: 0 0 14px; }
        form p label { display: block; margin-bottom: 5px; font-size: 14px; color: #374151; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border .15s;
        }
        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,.1);
        }

        .muted { color: #6b7280; font-size: 14px; }
        .error { color: #dc2626; font-size: 13px; margin-top: 4px; }
        .success-box {
            padding: 24px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 10px;
            color: #065f46;
            text-align: center;
        }
        .success-box h3 { color: #065f46; }
        .center { text-align: center; }
        .mt-2 { margin-top: 14px; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'index' %}" class="logo">🛋 Мебель</a>
        <nav>
            {% if user.is_authenticated %}
                <span class="muted">Привет, <b>{{ user.username }}</b></span>
                <a href="{% url 'profile' %}">Профиль</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
