
name: Python Tests

on:
  push:
  pull_request:

jobs:
  test-laba1:
    name: Test Laba 1
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./laba1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync pytest test/
